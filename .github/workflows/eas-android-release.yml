name: EAS Android Release Build

# Manual only. Building and submitting a production Android release is a
# deliberate, owner-directed release action (see AGENTS.md's "Native release
# procedure") -- it must never fire automatically on a push or PR.
#
# The `submit` input (default true, preserving the original behaviour) gates
# every Play-facing step. Dispatch with it off to validate that the native
# build still compiles -- after a dependency, Expo SDK or targetSdk change --
# without putting an unverified binary in front of testers. The AAB is
# uploaded as a workflow artifact either way, so it can be installed and
# checked on a device first.
#
# Runs the Android build on GitHub's Linux runner via `eas build --local`,
# which needs a Unix host and can't run on the Windows dev machine this repo
# is normally worked from. Requires four repository secrets:
#   - EXPO_TOKEN: an access token from
#     https://expo.dev/accounts/<account>/settings/access-tokens, scoped to
#     this Expo account, with permission to build for the noteschain project.
#   - GOOGLE_SERVICES_JSON: the full content of the Firebase Android client
#     config (Firebase Console -> Project Settings -> your Android app ->
#     google-services.json), which registers the app with FCM for push
#     notifications. Written to apps/mobile/google-services.json (gitignored)
#     before the build, per app.config.ts's android.googleServicesFile --
#     the build fails without it once the file is referenced. Not a secret
#     credential in the traditional sense (no private key inside), but kept
#     out of git the same way as the two below, rather than committed.
#   - GOOGLE_SERVICE_ACCOUNT_KEY: the full JSON key file content for the
#     Google Cloud service account linked in Play Console's API access
#     settings. Linking it in Play Console only grants that service account
#     permission to manage releases -- eas submit still needs the actual key
#     file, which this workflow writes to apps/mobile/google-service-account.json
#     (gitignored) right before submitting, per eas.json's
#     submit.production.android.serviceAccountKeyPath.
#   - NOTESCHAIN_RELEASE_POLICY_TOKEN: a random 32+ character value matching
#     RELEASE_POLICY_WEBHOOK_SECRET on the deployed API. It can advance only
#     latestBuild/latestVersion after Play confirms availability; it cannot
#     change minimumBuild or make a release mandatory.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit to Play Console's internal testing track after building"
        type: boolean
        default: true

# EAS remote versionCode allocation is global. Do not let two manual releases
# allocate/build/submit concurrently and accidentally associate a later code
# with the earlier AAB.
concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/mobile imports packages/{shared,validation} via their built
      # dist/ output (see each package's package.json "main"), same as
      # apps/api/apps/web in ci.yml.
      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Write Firebase Android client config
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > google-services.json

      # An empty/unset GOOGLE_SERVICES_JSON secret still produces a file that
      # `existsSync` sees, so app.config.ts's own check can't catch this --
      # the build then succeeds and produces an installable APK/AAB that
      # fails at runtime with "Default FirebaseApp is not initialized",
      # discoverable only by a person on a real device days later. Checking
      # here turns that into an immediate, legible CI failure instead.
      - name: Verify the Firebase Android client config is real
        working-directory: apps/mobile
        run: |
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("google-services.json", "utf8");
            let data;
            try {
              data = JSON.parse(raw);
            } catch {
              console.error("google-services.json is not valid JSON (" + raw.length + " byte(s) written) -- the GOOGLE_SERVICES_JSON repository secret is missing or empty.");
              process.exit(1);
            }
            const client = data.client?.find(
              (candidate) => candidate.client_info?.android_client_info?.package_name === "org.noteschain.app"
            );
            if (!client) {
              const packageNames = data.client
                ?.map((candidate) => candidate.client_info?.android_client_info?.package_name)
                .filter(Boolean)
                .join(", ") ?? "none";
              console.error("google-services.json does not contain Android package \"org.noteschain.app\" (found: " + packageNames + ").");
              process.exit(1);
            }
            const appId = client.client_info?.mobilesdk_app_id;
            const apiKey = client.api_key?.find((key) => typeof key.current_key === "string" && key.current_key.length > 0)?.current_key;
            const projectNumber = data.project_info?.project_number;
            if (!appId || !apiKey || !projectNumber) {
              console.error("google-services.json is missing the Firebase Android app ID, API key, or project number needed to initialize Firebase.");
              process.exit(1);
            }
            console.log("google-services.json looks valid for org.noteschain.app.");
          '

      - name: EAS build (local, production profile, Android)
        working-directory: apps/mobile
        run: |
          npx eas-cli build \
            --local \
            --platform android \
            --profile production \
            --non-interactive \
            --output "${{ runner.temp }}/noteschain-production.aab"

      # With appVersionSource=remote and production.autoIncrement=true, EAS
      # allocates this versionCode as it starts the build. Read it only after
      # the build completes; the concurrency guard above prevents ambiguity.
      - name: Read allocated Android versionCode and display version
        id: android-version
        working-directory: apps/mobile
        run: |
          version_code="$(npx eas-cli build:version:get --platform android --profile production --json --non-interactive | node ../../scripts/read-eas-android-version-code.mjs)"
          version_name="$(npx expo config --type public --json | node -e 'const fs = require("fs"); const config = JSON.parse(fs.readFileSync(0, "utf8")); const version = config.expo?.version ?? config.version; if (typeof version !== "string" || !version.trim()) process.exit(1); process.stdout.write(version.trim());')"
          printf 'version_code=%s\nversion_name=%s\n' "$version_code" "$version_name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: noteschain-production-aab
          path: ${{ runner.temp }}/noteschain-production.aab

      - name: Write Google service account key
        if: ${{ inputs.submit }}
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > google-service-account.json

      # eas.json's submit.production.android.track is "internal" -- this
      # pushes to Play Console's internal testing track, not a public rollout.
      - name: Submit to Play Console (internal testing track)
        if: ${{ inputs.submit }}
        working-directory: apps/mobile
        run: |
          npx eas-cli submit \
            --platform android \
            --profile production \
            --path "${{ runner.temp }}/noteschain-production.aab" \
            --non-interactive

      # Google Play can take time to process an internal-test release. The
      # public API advances only after its release API reports this exact
      # versionCode as PUBLISHED for the internal track. A timeout leaves policy unchanged; use the
      # separate recovery workflow once Play finishes processing.
      - name: Wait for Play availability and publish optional-update policy
        if: ${{ inputs.submit }}
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          NOTESCHAIN_RELEASE_POLICY_TOKEN: ${{ secrets.NOTESCHAIN_RELEASE_POLICY_TOKEN }}
          ANDROID_VERSION_CODE: ${{ steps.android-version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.android-version.outputs.version_name }}
          POLL_INTERVAL_SECONDS: "300"
          MAX_WAIT_SECONDS: "14400"
        run: node scripts/sync-android-play-policy.mjs

      - name: Remove Google service account key
        if: always()
        working-directory: apps/mobile
        run: rm -f google-service-account.json

      - name: Remove Firebase Android client config
        if: always()
        working-directory: apps/mobile
        run: rm -f google-services.json

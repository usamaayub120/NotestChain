name: CI

# Build/lint/typecheck/test on every push and PR. On a push to main, also
# build the runtime Docker image and push it to GHCR — nothing here ever
# deploys anywhere; pulling the new image onto the VPS is a manual step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Matches apps/api/src/test/setupEnv.ts's own fallback — the Postgres
  # service container below is configured with the same credentials/db name.
  DATABASE_URL: postgresql://postgres:password@localhost:5432/noteschain_test

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: noteschain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates the Prisma client's types — apps/api and apps/worker both
      # import @prisma/client, so this has to exist before typecheck/lint,
      # not just before the API's tests.
      - name: Prisma generate
        run: pnpm run db:generate

      # apps/api and apps/worker import packages/{shared,validation,blockchain-client}
      # via their built dist/ output (see each package's package.json "main"),
      # not raw source — this must run before typecheck/lint/test.
      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Apply test-DB migrations
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Worker unit tests
        run: pnpm --filter @noteschain/worker test

      - name: API integration tests
        run: pnpm --filter @noteschain/api test

      - name: Web unit/component tests
        run: pnpm --filter @noteschain/web test

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires an all-lowercase image path; github.repository preserves
      # whatever case the repo was created with, so it's lowercased here
      # rather than relying on that.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

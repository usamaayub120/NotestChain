[package]
name = "decentralized_notes"
version = "0.1.0"
description = "NotesChain — permanent, verifiable publication records on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "decentralized_notes"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"

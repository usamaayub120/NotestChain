[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Signals sent to supervisord (docker stop -> SIGTERM) are relayed to each
; child via its own stopsignal below, so all three processes get a real
; chance to shut down gracefully instead of being killed outright.

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:api]
command=node apps/api/dist/server.js
directory=/app
user=noteschain
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=15
environment=NODE_ENV="production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:worker]
command=node apps/worker/dist/worker.js
directory=/app
user=noteschain
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=15
environment=NODE_ENV="production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

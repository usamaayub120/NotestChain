worker_processes auto;
pid /run/nginx.pid;
# Master process binds :80 as root (started by supervisord), then workers
# that actually handle requests drop to this unprivileged user — the only
# reason the container's entrypoint itself still runs as root at all.
user nginx nginx;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml
             application/xml+rss text/javascript image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (Helmet sets the fine-grained CSP on API responses;
    # these cover the static frontend and apply as a sane baseline everywhere).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location = /health {
      proxy_pass http://127.0.0.1:3001/health;
      proxy_http_version 1.1;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:3001/api/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket forwarding (not required by the API today, kept so an
      # authenticated realtime channel could be added later without an
      # Nginx change).
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;

      client_max_body_size 1m;

      # JSON responses have no business showing up in search results.
      add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Versioned static assets — long cache, filenames are content-hashed by Vite.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|avif)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location = /manifest.webmanifest {
      add_header Cache-Control "public, max-age=3600";
      try_files $uri =404;
    }

    location = /robots.txt {
      default_type text/plain;
      add_header Cache-Control "public, max-age=3600";
      try_files $uri =404;
    }

    # SPA fallback — everything else resolves through the React app's router.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}

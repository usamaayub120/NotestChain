<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16151A" media="(prefers-color-scheme: dark)" />
    <!-- The two faces that render above the fold on every page. All seven
         @font-face blocks carry font-display: swap, but with no preload each
         file is only discovered after the CSS parses -  a guaranteed FOUT on
         first paint, which is the exact WebView case DESIGN_SYSTEM.md §4
         cites as the reason for self-hosting them in the first place.
         IBM Plex Mono is deliberately not preloaded: it only appears inside
         the proof sheet. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage-grotesque-variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/figtree-variable.woff2" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS does not support SVG for apple-touch-icon: pointing this at
         favicon.svg silently failed and Safari fell back to a screenshot of
         the page. Generated by scripts/generate-app-icons.mjs. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!--
      Everything between these markers is a static fallback only. On the
      public routes it owns (see infra/nginx/nginx.conf's proxy_pass blocks
      and apps/api/src/modules/seo), the API rewrites this exact block with
      real per-page tags before Nginx would otherwise serve this file
      verbatim — see apps/api/src/modules/seo/htmlTemplate.ts. This fallback
      only surfaces if that layer is ever unreachable, so keep it accurate
      to the homepage rather than deleting it.
    -->
    <!-- SEO:START -->
    <title>NotesChain — Thoughts worth keeping.</title>
    <meta name="description" content="A public writing platform for publishing permanent, verifiable thoughts." />
    <link rel="canonical" href="/" />
    <meta property="og:site_name" content="NotesChain" />
    <meta property="og:title" content="NotesChain" />
    <meta property="og:description" content="Thoughts worth keeping." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- SEO:END -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

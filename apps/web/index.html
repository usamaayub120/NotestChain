<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16151A" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- TODO(Phase 6): generate real raster app icons (192/512/maskable + apple-touch-icon) from the Kept Stamp mark. -->
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!--
      Everything between these markers is a static fallback only. On the
      public routes it owns (see infra/nginx/nginx.conf's proxy_pass blocks
      and apps/api/src/modules/seo), the API rewrites this exact block with
      real per-page tags before Nginx would otherwise serve this file
      verbatim — see apps/api/src/modules/seo/htmlTemplate.ts. This fallback
      only surfaces if that layer is ever unreachable, so keep it accurate
      to the homepage rather than deleting it.
    -->
    <!-- SEO:START -->
    <title>NotesChain — Thoughts worth keeping.</title>
    <meta name="description" content="A public writing platform for publishing permanent, verifiable thoughts." />
    <link rel="canonical" href="/" />
    <meta property="og:site_name" content="NotesChain" />
    <meta property="og:title" content="NotesChain" />
    <meta property="og:description" content="Thoughts worth keeping." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- SEO:END -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
